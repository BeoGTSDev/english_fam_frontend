name: Frontend Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Verify formatting
        run: |
          npm run format
          git diff --exit-code
      - run: npm run lint
      - run: npm run typecheck
